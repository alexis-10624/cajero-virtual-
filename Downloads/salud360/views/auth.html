<section id="sec-auth" class="seccion tarjeta tarjeta--centrada hidden">
    <div class="tabs">
        <button id="tab-login" onclick="cambiarTabAuth('login')" class="tab">Iniciar Sesión</button>
        <button id="tab-registro" onclick="cambiarTabAuth('registro')" class="tab activa">Registrarse</button>
    </div>

    <form id="formLogin" onsubmit="iniciarSesion(event)" class="formulario hidden">
        <div class="campo">
            <label>Correo Electrónico</label>
            <input type="email" id="loginEmail" required placeholder="correo@ejemplo.com">
        </div>
        <div class="campo">
            <label>Contraseña</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primario btn-bloque">Entrar al Sistema</button>
    </form>

    <form id="formRegistro" onsubmit="registrarUsuario(event)" class="formulario">
        <div class="campo">
            <label>Nombre Completo</label>
            <input type="text" id="regNombre" required placeholder="Tu nombre completo">
        </div>

        <div class="campos-doc">
            <div class="campo">
                <label>Tipo Doc.</label>
                <select id="regTipoDoc">
                    <option value="CC">CC</option>
                    <option value="TI">TI</option>
                    <option value="CE">CE</option>
                </select>
            </div>
            <div class="campo">
                <label>Número</label>
                <input type="text" id="regNumDoc" required placeholder="Número de documento">
            </div>
        </div>

        <div class="campo">
            <label>Correo Electrónico</label>
            <input type="email" id="regEmail" required placeholder="correo@ejemplo.com">
        </div>

        <div class="campo">
            <label>Teléfono</label>
            <input type="tel" id="regTelefono" required placeholder="Número de contacto">
        </div>

        <div class="campo">
            <label>Crea una Contraseña</label>
            <input type="password" id="regPassword" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-exito btn-bloque">Crear Cuenta</button>
    </form>
</section>
